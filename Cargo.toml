[package]
name = "tengo"
version = "2.0.0"
edition = "2021"
rust-version = "1.92"
description = "Tengo: a small, dynamic, fast, secure script language"
license = "MIT"
publish = false

[lib]
name = "tengo"
path = "src/lib.rs"

[[bin]]
name = "tengo"
path = "src/main.rs"

[dependencies]
regex = "1"

[profile.release]
opt-level = 3
debug = false
